<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Farm Plus</title>
    <link rel="shortcut icon" href="../Resource/LogoPNG.png" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="../CSS/StylesLogin.css" />
  </head>
  <body>
    <form id="loginForm">
      <h2 class="titt"><strong>¡Bienvenido!</strong></h2>

      <label for="usuario">
        <input type="text" placeholder="👤Usuario" id="usuario" required />
      </label>

      <label for="clave" class="password-container">
        <input type="password" placeholder="🔒Contraseña" id="clave" required />
        <i class="bi bi-eye" id="togglePassword"></i>
      </label>
      <p id="login-message"></p>

      <input type="submit" value="Iniciar sesión" class="ac" />

      <p class="text">
        ¿No te has registrado? <a href="signup.html" class="link">Entra aquí</a>
      </p>
      <p class="text">
        <a href="olvide_contrasena.html" class="link"
          >¿Olvidaste tu contraseña?</a
        >
      </p>
    </form>

    <script src="../JS/CodeLogin.js"></script>

    <script>
      // Limpiar historial de navegación al hacer login
      sessionStorage.removeItem("navigationHistory");
    </script>
  </body>
</html>
